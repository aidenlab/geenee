# The top level is local development (`npm run dev`) and the build's defaults; it
# is never deployed. Deployments are the named environments at the bottom.
name = "geenee"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
# The Cloudflare account that owns the 3dg.io zone (Theaidenlab@gmail.com's
# Account), which also holds both Upstreams. Named so that a login with access
# to several accounts does not have to choose.
account_id = "1eadb18bb8557fd1bd06b1d0310a902e"

# The Workspace page (index.html, built by Vite) is a static asset. The binding
# lets the Worker serve it at a Room link, /r/<Room id>, too. Named environments
# inherit it.
[assets]
binding = "ASSETS"

# One Durable Object per Room, holding geenee's channel to the Workspaces of the Room.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
# The two Upstreams geenee forwards to (ADR 0001): the /mcp address of each.
# Local development uses the deployed dev Upstreams too, as geenee holds no
# Viewer of its own to run beside it. The Juicebox Upstream is juicebox-mcp's
# view stack, whose Viewer is the juicebox-view page; juicebox-web is retired.
IGV_UPSTREAM_URL = "https://igv-bot-mcp-dev.3dg.io/mcp"
JUICEBOX_UPSTREAM_URL = "https://juicebot-view-mcp-dev.3dg.io/mcp"

# ── The two deployments ──────────────────────────────────────────────────────
# dev is the one people add as a Connector; test is a single slot for trying a
# branch without touching it. Both forward to the same Upstreams. They share
# nothing else: each is its own Worker with its own Rooms, so a deploy to one
# never touches the other. Wrangler creates the DNS record for each custom
# domain; the zone is on the same account. No *.workers.dev hostname and no
# preview URLs, so each has one public address. Named environments do not
# inherit `vars` or `durable_objects`, so those are repeated; migrations are
# top-level and apply to every environment. dev is deployed by
# scripts/deploy.sh, test by scripts/deploy-test.sh.

# "geenee dev": Worker geenee-view-dev at https://geenee-view-dev.3dg.io, the
# published Connector address. Hosts use /mcp, and a person sees the Workspace
# at /, which uses /ws. The Worker keeps its name from when there was also a
# juicebox-web deployment, so that the address and its Rooms stay.
[env.dev]
name = "geenee-view-dev"
routes = [
  { pattern = "geenee-view-dev.3dg.io", custom_domain = true },
]
workers_dev = false
preview_urls = false

[env.dev.observability.logs]
enabled = true

[[env.dev.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[env.dev.vars]
IGV_UPSTREAM_URL = "https://igv-bot-mcp-dev.3dg.io/mcp"
JUICEBOX_UPSTREAM_URL = "https://juicebot-view-mcp-dev.3dg.io/mcp"

# "geenee test": Worker geenee-test at https://geenee-test.3dg.io, laid out as
# geenee dev. Whichever ref was deployed to it last is what it runs.
[env.test]
name = "geenee-test"
routes = [
  { pattern = "geenee-test.3dg.io", custom_domain = true },
]
workers_dev = false
preview_urls = false

[env.test.observability.logs]
enabled = true

[[env.test.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[env.test.vars]
IGV_UPSTREAM_URL = "https://igv-bot-mcp-dev.3dg.io/mcp"
JUICEBOX_UPSTREAM_URL = "https://juicebot-view-mcp-dev.3dg.io/mcp"
